<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardback Radar</title>
<meta name="description" content="Dagelijkse stand van zaken in de actiefigurenscene.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B5CD9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EDEFF2; --card:#FFFFFF; --sunk:#E3E7ED;
  --ink:#14171F; --ink-soft:#5A6274; --line:#D2D8E1;
  --red:#C92A20; --blue:#1B5CD9; --deep:#102B69;
  --yellow:#F5B915; --green:#17805B;
  --shadow:0 1px 0 rgba(20,23,31,.05), 0 8px 20px -15px rgba(20,23,31,.5);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#13161C; --card:#1C2029; --sunk:#171B23;
    --ink:#E9ECF3; --ink-soft:#98A1B4; --line:#2E3442;
    --red:#FF5548; --blue:#3D74E8; --deep:#0D1D45;
    --yellow:#FFC93D; --green:#35C48D;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 24px -16px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Barlow","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--blue)}
button,input{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:3px}

.wrap{
  max-width:720px;margin:0 auto;
  padding:18px 16px calc(40px + var(--safe-bot));
}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:20;
  background:var(--blue);color:#fff;
  padding:calc(12px + var(--safe-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;
  border-bottom:3px solid var(--deep);
}
.bar .id{flex:1;min-width:0}
.bar h1{
  font-family:Anton,"Arial Narrow",Impact,sans-serif;
  font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1;
}
.bar .stamp{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  opacity:.9;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.refresh{
  flex:none;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);
  display:grid;place-items:center;cursor:pointer;
}
.refresh svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.refresh:disabled{opacity:.5}
.refresh.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.flash{
  padding:9px 16px;font-size:13.5px;text-align:center;
  background:var(--sunk);border-bottom:1px solid var(--line);color:var(--ink-soft);
}
.flash.warn{background:var(--yellow);color:#2A2005}
.flash.bad{background:var(--red);color:#fff}

/* ---------- view switch ---------- */
.switch{
  display:flex;gap:6px;background:var(--sunk);border:1.5px solid var(--line);
  border-radius:12px;padding:4px;margin-bottom:22px;
}
.switch button{
  flex:1;background:none;border:0;border-radius:9px;padding:9px 8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink-soft);
}
.switch svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.switch span{
  font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;
}
.switch button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- shared ---------- */
.stack{display:flex;flex-direction:column;gap:32px}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
}
h2.sec{
  font-family:Anton,"Arial Narrow",Impact,sans-serif;
  font-size:23px;text-transform:uppercase;letter-spacing:.02em;margin:2px 0 6px;
}
.lede{color:var(--ink-soft);font-size:15px;margin-bottom:16px}
.empty{
  color:var(--ink-soft);font-size:14.5px;background:var(--sunk);
  border:1px dashed var(--line);border-radius:10px;padding:16px;
}

/* ---------- live feed ---------- */
.live-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.live-head .eyebrow{flex:1}
.pulse{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
}
.pulse i{
  width:7px;height:7px;border-radius:50%;background:var(--green);
  animation:blip 2.4s ease-in-out infinite;
}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.news{display:flex;flex-direction:column}
.news a{
  display:block;padding:12px 0;border-bottom:1px solid var(--line);
  text-decoration:none;color:var(--ink);
}
.news a:last-child{border-bottom:0}
.news .hl{font-weight:600;font-size:15.5px;line-height:1.4}
.news .meta{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-soft);
  letter-spacing:.06em;margin-top:4px;
}
.news .meta b{color:var(--blue);font-weight:400}
.more{
  background:none;border:1.5px solid var(--line);border-radius:9px;
  padding:9px 14px;margin-top:12px;cursor:pointer;font-size:14px;
  color:var(--ink-soft);width:100%;
}
.more:active{border-color:var(--ink)}

/* ---------- opgezocht ---------- */
.tr{display:flex;align-items:center;gap:10px;padding:9px 0}
.tr .nm{
  flex:none;width:112px;font-size:14.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.tr .track{
  flex:1;height:10px;background:var(--sunk);border:1px solid var(--line);
  border-radius:5px;overflow:hidden;
}
.tr .track i{display:block;height:100%;background:var(--ink-soft);border-radius:4px}
.tr.up .track i{background:var(--green)}
.tr .pct{
  flex:none;width:52px;text-align:right;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  font-variant-numeric:tabular-nums;color:var(--ink-soft);
}
.tr.up .pct{color:var(--green)}
.tr .per{
  flex:none;width:66px;text-align:right;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}
.caveat{
  font-size:13px;color:var(--ink-soft);margin-top:12px;line-height:1.6;
  border-top:1px dashed var(--line);padding-top:11px;
}

/* ---------- search ---------- */
.seek{display:flex;gap:8px;margin-bottom:12px}
.seek input{
  flex:1;min-width:0;font-size:16px;background:var(--card);
  border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;
}
.seek input::placeholder{color:var(--ink-soft)}
.seek button{
  flex:none;width:48px;border:0;border-radius:10px;background:var(--blue);
  display:grid;place-items:center;cursor:pointer;
}
.seek button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.seek-hint{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  padding:8px 14px;font-size:14px;text-decoration:none;color:var(--ink);
}

/* ---------- waves ---------- */
.wave{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;
}
.wave-top{
  display:flex;gap:16px;align-items:center;
  padding:15px 16px;background:var(--sunk);border-bottom:1.5px solid var(--line);
}
.clock{flex:none;text-align:center;min-width:74px}
.clock .num{
  font-family:Anton,"Arial Narrow",Impact,sans-serif;
  font-size:36px;line-height:1;color:var(--red);font-variant-numeric:tabular-nums;
}
.wave.minor .clock .num{color:var(--ink-soft);font-size:28px}
.clock .unit{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;line-height:1.3;
}
.wave-title{flex:1;min-width:0}
.wave-title h3{
  font-family:Anton,"Arial Narrow",Impact,sans-serif;
  font-size:18px;text-transform:uppercase;letter-spacing:.02em;
}
.wave-title .when{color:var(--ink-soft);font-size:13px;margin-top:3px}
.wave-body{padding:15px 16px;display:flex;flex-direction:column;gap:11px}
.wave-body p{font-size:15px}
.do{
  background:var(--sunk);border-left:4px solid var(--yellow);border-radius:0 8px 8px 0;
  padding:12px 14px;font-size:14.5px;
}
.do b{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;
}

/* ---------- drops ---------- */
.drop{padding:13px 0;border-bottom:1px solid var(--line)}
.drop:last-child{border-bottom:0}
.drop .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.maker{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);flex:none;
}
.heat{
  margin-left:auto;flex:none;
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink-soft);
}
.heat.hot{border-color:var(--red);color:var(--red)}
.heat.yours{border-color:var(--green);color:var(--green)}
.heat.mine{border-color:var(--blue);color:#fff;background:var(--blue);margin-left:0}
.drop .what{font-weight:600;margin-top:5px;font-size:15.5px}
.drop .note{font-size:14px;color:var(--ink-soft);margin-top:3px}

/* ---------- cards ---------- */
.tcard{
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:11px;box-shadow:var(--shadow);
}
.tcard h3{
  font-family:Anton,"Arial Narrow",Impact,sans-serif;
  font-size:15px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;
}
.tcard p{font-size:14.5px;color:var(--ink-soft)}

.idea{
  background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--blue);
  border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:11px;
}
.idea .slot{
  font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);
}
.idea .ttl{font-weight:600;font-size:15.5px;margin-top:5px}
.idea .why{font-size:14.5px;color:var(--ink-soft);margin-top:5px}

/* ---------- idee-onderdelen ---------- */
.hook{
  background:var(--sunk);border-left:4px solid var(--red);border-radius:0 8px 8px 0;
  padding:10px 13px;margin-top:9px;font-size:14.5px;
}
.hook b,.send b{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;
}
.send{
  background:var(--sunk);border-left:4px solid var(--green);border-radius:0 8px 8px 0;
  padding:10px 13px;margin-top:8px;font-size:14.5px;
}
.rule{
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:15px 16px;box-shadow:var(--shadow);
}
.rule h3{
  font-family:Anton,"Arial Narrow",Impact,sans-serif;
  font-size:15px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;
}
.rule p{font-size:14.5px;color:var(--ink-soft)}
.rule p + p{margin-top:9px}
.ex{
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.65;
  border-radius:8px;padding:10px 12px;margin-top:9px;
}
.ex.bad{background:var(--sunk);color:var(--ink-soft);border-left:3px solid var(--red)}
.ex.good{background:var(--sunk);color:var(--ink);border-left:3px solid var(--green)}
.ex i{
  display:block;font-style:normal;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;
}

/* ---------- copy ---------- */
.tapline{
  display:flex;align-items:center;gap:10px;margin-top:10px;
  background:var(--sunk);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;cursor:pointer;text-align:left;width:100%;
}
.tapline code{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink);
  flex:1;word-break:break-word;line-height:1.7;
}
.tapline .cue,.setrow .cue{
  flex:none;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
}
.tapline.done,.setrow.done{border-color:var(--green)}
.tapline.done .cue,.setrow.done .cue{color:var(--green)}
.setrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:9px;cursor:pointer;
}
.setrow .nm{
  font-family:Anton,"Arial Narrow",Impact,sans-serif;
  font-size:14px;text-transform:uppercase;letter-spacing:.03em;flex:none;min-width:104px;
}
.setrow .pv{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ---------- agenda ---------- */
.ag{
  display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);
}
.ag:last-child{border-bottom:0}
.ag .day{
  flex:none;width:52px;text-align:center;
}
.ag .day b{
  display:block;font-family:Anton,"Arial Narrow",Impact,sans-serif;
  font-size:22px;line-height:1;
}
.ag .day i{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-style:normal;margin-top:3px;
}
.ag .body{flex:1;min-width:0}
.ag .body .nm{font-weight:600;font-size:15.5px}
.ag .body .where{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);
  letter-spacing:.05em;margin-top:3px;
}
.ag .body .nt{font-size:14px;color:var(--ink-soft);margin-top:4px}
.ag .body a{font-size:13.5px;display:inline-block;margin-top:5px}
.flag{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.1em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);
  color:var(--ink-soft);margin-left:6px;vertical-align:1px;
}
.cd{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);
  margin-left:auto;flex:none;
}

.foot{
  margin-top:30px;padding-top:18px;border-top:2px solid var(--line);
  font-size:12.5px;color:var(--ink-soft);
}
.foot h3{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:8px;
}
.foot ul{margin:0 0 12px;padding-left:17px;line-height:1.8}
.foot p{margin-bottom:9px}
.skel{color:var(--ink-soft);padding:30px 0;text-align:center;font-size:15px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="id">
    <h1>Cardback Radar</h1>
    <div class="stamp" id="stamp">laden…</div>
  </div>
  <button class="refresh" id="refresh" type="button" aria-label="Ververs">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/>
    </svg>
  </button>
</header>
<div class="flash" id="flash" hidden></div>

<div class="wrap">
  <div class="switch" id="switch" role="tablist">
    <button type="button" data-view="radar" aria-selected="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/></svg>
      <span>Radar</span>
    </button>
    <button type="button" data-view="agenda" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>
      <span>Agenda</span>
    </button>
  </div>

  <div id="view-radar"><p class="skel">Bezig met laden…</p></div>
  <div id="view-agenda" hidden></div>

  <div class="foot" id="foot" hidden>
    <h3>Bronnen</h3>
    <ul id="srcList"></ul>
    <p id="srcNote"></p>
    <p>De radar wordt elke ochtend om 7:00 gevuld door een taak die de bronnen naleest. De knop rechtsboven haalt
      de nieuwste stand op. Zonder verbinding zie je de laatste stand die op je telefoon staat.</p>
  </div>
</div>



<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var flash = $("flash"), stamp = $("stamp"), refresh = $("refresh");

  /* Hashtags zijn sinds 2025 geen bereikmiddel meer maar een etiket:
     Instagram staat er nog ongeveer vijf toe en leest vooral je bijschrift.
     Elke set hieronder is dus compleet — niet combineren. */
  var SETS = [
    ["Marvel", "#marvellegends #actionfigures #marvelcollector #toystagram"],
    ["DC", "#dcmultiverse #mcfarlanetoys #actionfigures #toystagram"],
    ["TMNT", "#tmnt #tmntcollector #actionfigures #toystagram"],
    ["He-Man", "#motu #mastersoftheuniverse #actionfigures #toystagram"],
    ["Power Rangers", "#powerrangers #lightningcollection #actionfigures #toystagram"],
    ["Godzilla", "#godzilla #kaijucollector #actionfigures #toystagram"],
    ["NECA", "#neca #necatoys #actionfigures #toystagram"],
    ["Vintage", "#vintagetoys #80stoys #actionfigures #toystagram"],
    ["Fotografie", "#toyphotography #actionfigurephotography #toycollector #toystagram"]
  ];

  /* per weekdag: naam, community-tag, onderwerp, en waarom iemand het doorstuurt */
  var HOOKS = [
    ["zondag", "#ToyDayIsPunday", "een woordgrap", "iemand die je aan het lachen wilt maken"],
    ["maandag", "#MechanoidMonday", "robots en mecha", "de vriend die vroeger alles omkatte"],
    ["dinsdag", "#ToyDinoTuesday", "kaiju en dino's", "wie de films kent en de figuren nooit zag"],
    ["woensdag", "#slumpday", "een snelle, onbewerkte foto", "iemand die dezelfde stapel thuis heeft"],
    ["donderdag", "#ThrowbackThursday", "vintage", "je broer, of wie er als kind bij was"],
    ["vrijdag", "#NoFigureFriday", "accessoires zonder figuur", "de verzamelaar die dit onderdeel zoekt"],
    ["zaterdag", "#toyhunting", "vondsten en de plank", "wie meegaat naar de volgende rommelmarkt"]
  ];

  var SEARCHES = [
    ["Marvel Legends", "marvel legends new figure"],
    ["MOTU", "masters of the universe figure news"],
    ["TMNT", "tmnt action figure news"],
    ["Godzilla", "godzilla figure kaiju news"],
    ["Power Rangers", "power rangers lightning collection"],
    ["DC", "dc multiverse mcfarlane figure"],
    ["Vintage", "vintage action figure find"]
  ];
  var MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

  /* ---------- storage ---------- */
  function get(key, fallback) {
    try {
      var raw = localStorage.getItem("cbr:" + key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function set(key, val) {
    try { localStorage.setItem("cbr:" + key, JSON.stringify(val)); } catch (e) {}
  }

  var data = null;
  var feed = null;
  var feedOpen = false;

  /* ---------- helpers ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function days(a, b) { return Math.round((b - a) / 86400000); }
  function parseDay(s) {
    var p = String(s || "").split("-");
    if (p.length !== 3) return null;
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d) ? null : d;
  }
  function legacyCopy(text, ok) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) {}
    document.body.removeChild(ta);
  }
  function copyTap(btn, text) {
    btn.addEventListener("click", function () {
      var ok = function () {
        var cue = btn.querySelector(".cue");
        var was = cue ? cue.textContent : "";
        btn.classList.add("done");
        if (cue) cue.textContent = "gekopieerd";
        setTimeout(function () {
          btn.classList.remove("done");
          if (cue) cue.textContent = was;
        }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, function () { legacyCopy(text, ok); });
      } else { legacyCopy(text, ok); }
    });
  }
  function ago(isoStr) {
    if (!isoStr) return "";
    var t = new Date(isoStr);
    if (isNaN(t)) return "";
    var mins = Math.round((Date.now() - t.getTime()) / 60000);
    if (mins < 2) return "zojuist";
    if (mins < 60) return mins + " min geleden";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + " uur geleden";
    var dys = Math.round(hrs / 24);
    if (dys === 1) return "gisteren";
    if (dys < 8) return dys + " dagen geleden";
    return t.getDate() + " " + MONTHS[t.getMonth()];
  }

  function feedAge(isoStr) {
    var a = ago(isoStr);
    return a ? "bijgewerkt " + a : "live";
  }

  function showFlash(text, kind) {
    if (!text) { flash.hidden = true; return; }
    flash.hidden = false;
    flash.className = "flash" + (kind ? " " + kind : "");
    flash.textContent = text;
  }

  /* ================= RADAR ================= */
  function renderRadar() {
    var host = $("view-radar");
    host.innerHTML = "";
    var d = data;
    if (!d) { host.appendChild(el("p", "skel", "Nog niets opgehaald.")); return; }

    var stack = el("div", "stack");
    var today = midnight(new Date());

    /* live news */
    var items = (feed && feed.items) || [];
    if (items.length) {
      var sN = el("section");
      var head = el("div", "live-head");
      head.appendChild(el("div", "eyebrow", "Rechtstreeks van de vakpers"));
      var pulse = el("span", "pulse");
      pulse.appendChild(el("i"));
      pulse.appendChild(document.createTextNode(feedAge(feed.updatedISO)));
      head.appendChild(pulse);
      sN.appendChild(head);
      sN.appendChild(el("h2", "sec", "Nu binnen"));
      sN.appendChild(el("p", "lede", "Elk uur opgehaald bij de verzamelaarssites zelf. Tik om te lezen."));

      var news = el("news" === "" ? "div" : "div", "news");
      var showing = feedOpen ? items.length : Math.min(6, items.length);
      items.slice(0, showing).forEach(function (it) {
        var a = document.createElement("a");
        a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.appendChild(el("div", "hl", it.title || ""));
        var meta = el("div", "meta");
        meta.appendChild(el("b", null, it.source || ""));
        var when = ago(it.iso);
        if (when) meta.appendChild(document.createTextNode(" · " + when));
        a.appendChild(meta);
        news.appendChild(a);
      });
      sN.appendChild(news);

      if (items.length > 6) {
        var more = el("button", "more", feedOpen
          ? "Minder tonen"
          : "Nog " + (items.length - 6) + " berichten");
        more.type = "button";
        more.addEventListener("click", function () { feedOpen = !feedOpen; renderRadar(); });
        sN.appendChild(more);
      }
      stack.appendChild(sN);
    }

    /* wat er opgezocht wordt */
    var tr = (feed && feed.trends) || null;
    if (tr && tr.rows && tr.rows.length) {
      var sT = el("section");
      sT.appendChild(el("div", "eyebrow", "Publieke belangstelling"));
      sT.appendChild(el("h2", "sec", "Wat wordt er opgezocht"));
      sT.appendChild(el("p", "lede",
        "Hoeveel mensen dit onderwerp de afgelopen week op Wikipedia opzochten, vergeleken met de vier weken daarvoor."));

      var top = Math.max.apply(null, tr.rows.map(function (r) { return Math.abs(r.change || 0); }));
      if (!top) top = 1;

      tr.rows.forEach(function (r) {
        var row = el("div", "tr" + ((r.change || 0) > 0 ? " up" : ""));
        row.appendChild(el("div", "nm", r.label || ""));
        var track = el("div", "track");
        var fill = document.createElement("i");
        fill.style.width = Math.max(3, Math.round(Math.abs(r.change || 0) / top * 100)) + "%";
        track.appendChild(fill);
        row.appendChild(track);
        row.appendChild(el("div", "pct", ((r.change > 0) ? "+" : "") + (r.change || 0) + "%"));
        row.appendChild(el("div", "per", (r.perDay || 0).toLocaleString("nl-NL") + "/dag"));
        sT.appendChild(row);
      });

      sT.appendChild(el("p", "caveat",
        "Dit is geen Google-zoekvolume — dat geeft Google niet vrij zonder betaalde koppeling. Wikipedia-bezoek is een goede vervanger: het meet wie er iets over wil weten, en het beweegt bij dezelfde aanleidingen. Een sterke stijging betekent dat er iets gebeurd is; wat dat is, staat meestal in het nieuws hierboven."));
      stack.appendChild(sT);
    }

    /* search */
    var s0 = el("section");
    var seek = el("div", "seek");
    var q = document.createElement("input");
    q.type = "search"; q.setAttribute("enterkeyhint", "search");
    q.setAttribute("autocapitalize", "none");
    q.placeholder = "Zoek: godzilla, motu origins, neca tmnt…";
    var go = document.createElement("button");
    go.type = "button"; go.setAttribute("aria-label", "Zoeken");
    go.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>';
    seek.appendChild(q); seek.appendChild(go);
    s0.appendChild(seek);
    s0.appendChild(el("p", "seek-hint",
      "Opent het nieuws over jouw zoekwoord in je browser. Ik zet er zelf “action figure” bij als je dat niet doet, anders krijg je filmnieuws."));
    function doSeek() {
      var raw = q.value.trim();
      if (!raw) { q.focus(); return; }
      var toyish = /figure|toy|collect|neca|hasbro|mattel|mcfarlane|mezco|super7|playmates|bandai|legends|origins|preorder|cardback/.test(raw.toLowerCase());
      window.open("https://news.google.com/search?q=" +
        encodeURIComponent(toyish ? raw : raw + " action figure") + "&hl=nl", "_blank", "noopener");
    }
    go.addEventListener("click", doSeek);
    q.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doSeek(); } });
    var quick = el("div", "links");
    SEARCHES.forEach(function (it) {
      var a = document.createElement("a");
      a.href = "https://news.google.com/search?q=" + encodeURIComponent(it[1]) + "&hl=nl";
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = it[0];
      quick.appendChild(a);
    });
    s0.appendChild(quick);
    stack.appendChild(s0);

    /* waves */
    if (d.waves && d.waves.length) {
      var s1 = el("section");
      s1.appendChild(el("div", "eyebrow", "Waar de aandacht heen gaat"));
      s1.appendChild(el("h2", "sec", "De golven"));
      d.waves.forEach(function (w, i) {
        var box = el("div", "wave" + (i > 0 ? " minor" : ""));
        var top = el("div", "wave-top");
        var clock = el("div", "clock");
        var num = el("div", "num", "—");
        var unit = el("div", "unit", (w.countdown && w.countdown.unit) || "");
        var when = parseDay(w.countdown && w.countdown.date);
        if (when) {
          var n = (w.countdown.mode === "since") ? days(when, today) : days(today, when);
          if (n >= 0) num.textContent = n;
          else if (w.countdown.mode !== "since") { num.textContent = "nu"; unit.textContent = "in de zalen"; }
        }
        clock.appendChild(num); clock.appendChild(unit);
        top.appendChild(clock);
        var ttl = el("div", "wave-title");
        ttl.appendChild(el("h3", null, w.title || ""));
        if (w.when) ttl.appendChild(el("div", "when", w.when));
        top.appendChild(ttl);
        box.appendChild(top);
        var body = el("div", "wave-body");
        if (w.body) body.appendChild(el("p", null, w.body));
        if (w.do) {
          var doBox = el("div", "do");
          doBox.appendChild(el("b", null, "Wat je ermee doet"));
          doBox.appendChild(document.createTextNode(w.do));
          body.appendChild(doBox);
        }
        box.appendChild(body);
        s1.appendChild(box);
      });
      stack.appendChild(s1);
    }

    /* drops */
    if (d.drops && d.drops.length) {
      var s2 = el("section");
      s2.appendChild(el("div", "eyebrow", "Verse reveals en preorders"));
      s2.appendChild(el("h2", "sec", "Wat er net op tafel ligt"));
      s2.appendChild(el("p", "lede", "Groen betekent: dit raakt een lijn die jij al op de plank hebt staan."));
      d.drops.forEach(function (dr) {
        var row = el("div", "drop");
        var top = el("div", "top");
        top.appendChild(el("span", "maker", dr.maker || ""));
        var h = String(dr.heat || "").toLowerCase();
        var cls = h === "hot" ? "heat hot" : (h === "yours") ? "heat yours" : "heat";
        var label = h === "hot" ? "hot" : (h === "yours") ? "jouw lijn" : "zijlijn";
        top.appendChild(el("span", cls, label));
        row.appendChild(top);
        row.appendChild(el("div", "what", dr.what || ""));
        if (dr.note) row.appendChild(el("div", "note", dr.note));
        s2.appendChild(row);
      });
      stack.appendChild(s2);
    }

    /* talk */
    if (d.talk && d.talk.length) {
      var s3 = el("section");
      s3.appendChild(el("div", "eyebrow", "Waar het over gaat"));
      s3.appendChild(el("h2", "sec", "Het gesprek in de scene"));
      d.talk.forEach(function (t) {
        var c = el("div", "tcard");
        c.appendChild(el("h3", null, t.title || ""));
        c.appendChild(el("p", null, t.body || ""));
        s3.appendChild(c);
      });
      stack.appendChild(s3);
    }

    /* ideas — gebouwd op doorsturen, want dat is wat bereik geeft */
    var s4 = el("section");
    s4.appendChild(el("div", "eyebrow", "Vandaag"));
    s4.appendChild(el("h2", "sec", "Wat je zou posten"));
    s4.appendChild(el("p", "lede",
      "Een Reel haalt onder de 50.000 volgers ongeveer vier keer het bereik van een losse foto, en doorsturen weegt drie tot vijf keer zwaarder dan een like. Vandaar bij elk idee: de haak, en naar wie iemand dit stuurt."));

    var ideas = (d.ideas || []).slice();
    var hook = HOOKS[new Date().getDay()];
    ideas.push({
      slot: hook[0].charAt(0).toUpperCase() + hook[0].slice(1),
      title: "De vaste haak van vandaag: " + hook[2],
      hook: "Begin met het figuur al in beeld, niet met een lege plank — de eerste twee seconden bepalen of hij verder kijkt.",
      why: "Het is " + hook[0] + ", dus " + hook[1] + " staat open. Daar kijkt al publiek zonder dat je iets aan bereik hoeft te doen.",
      send: hook[3],
      tags: SETS[8][1]
    });

    ideas.forEach(function (it) {
      var box = el("div", "idea");
      box.appendChild(el("div", "slot", it.slot || ""));
      box.appendChild(el("div", "ttl", it.title || ""));
      if (it.why) box.appendChild(el("div", "why", it.why));
      if (it.hook) {
        var hk = el("div", "hook");
        hk.appendChild(el("b", null, "Eerste twee seconden"));
        hk.appendChild(document.createTextNode(it.hook));
        box.appendChild(hk);
      }
      if (it.send) {
        var sd = el("div", "send");
        sd.appendChild(el("b", null, "Wie stuurt dit door"));
        sd.appendChild(document.createTextNode(it.send));
        box.appendChild(sd);
      }
      if (it.tags) {
        var tap = el("button", "tapline");
        tap.type = "button";
        tap.appendChild(el("code", null, it.tags));
        tap.appendChild(el("span", "cue", "tik = kopie"));
        copyTap(tap, it.tags);
        box.appendChild(tap);
      }
      s4.appendChild(box);
    });
    stack.appendChild(s4);

    /* tags en, belangrijker, de woorden in je bijschrift */
    var s5 = el("section");
    s5.appendChild(el("div", "eyebrow", "Gevonden worden"));
    s5.appendChild(el("h2", "sec", "Tags en woorden"));
    s5.appendChild(el("p", "lede",
      "Hashtags zijn geen bereikmiddel meer — Instagram staat er nog ongeveer vijf toe en zegt zelf dat ze de zichtbaarheid niet vergroten. Elke set hieronder is compleet. Niet combineren."));

    SETS.forEach(function (st) {
      var row = el("button", "setrow");
      row.type = "button";
      row.appendChild(el("span", "nm", st[0]));
      row.appendChild(el("span", "pv", st[1]));
      row.appendChild(el("span", "cue", "kopie"));
      copyTap(row, st[1]);
      s5.appendChild(row);
    });

    var rule = el("div", "rule");
    rule.style.marginTop = "14px";
    rule.appendChild(el("h3", null, "Woorden in je bijschrift"));
    rule.appendChild(el("p", null,
      "Hier zit het bereik nu. Instagram leest je bijschrift, de tekst in beeld en het geluid om te bepalen waar je post over gaat. Noem dus gewoon uit: het personage, de lijn, de fabrikant en het jaar."));
    var bad = el("div", "ex bad");
    bad.appendChild(el("i", null, "levert weinig op"));
    bad.appendChild(document.createTextNode("Sunday shelf vibes \u2728 #toystagram #actionfigures #toycollector #toyphotography #vintagetoys #80stoys #retro #collector #plasticcrack #toycommunity"));
    rule.appendChild(bad);
    var good = el("div", "ex good");
    good.appendChild(el("i", null, "wordt wel gevonden"));
    good.appendChild(document.createTextNode("He-Man uit de MOTU Origins-lijn van Mattel, 2021, naast mijn originele uit 1983. Het zwaard van de oude ben ik ergens in de tuin kwijtgeraakt. Wie had deze ook?\n\n#motu #mastersoftheuniverse #actionfigures #toystagram"));
    rule.appendChild(good);
    rule.appendChild(el("p", null,
      "Zet diezelfde woorden ook als tekst in je Reel. Met ondertiteling kijkt ongeveer 65 procent hem uit, zonder 37 — en kijktijd is het signaal dat bepaalt of je überhaupt aan vreemden getoond wordt."));
    s5.appendChild(rule);
    stack.appendChild(s5);

    host.appendChild(stack);

    /* sources */
    var list = $("srcList");
    list.innerHTML = "";
    (d.sources || []).forEach(function (s) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = s.label;
      li.appendChild(a);
      list.appendChild(li);
    });
    $("srcNote").textContent = d.sourceNote || "";
    $("foot").hidden = false;
  }

  /* ================= AGENDA ================= */
  function renderAgenda() {
    var host = $("view-agenda");
    host.innerHTML = "";
    var stack = el("div", "stack");
    var today = midnight(new Date());
    var d = data || {};

    function dayBlock(when) {
      var day = el("div", "day");
      day.appendChild(el("b", null, String(when.getDate())));
      day.appendChild(el("i", null, MONTHS[when.getMonth()]));
      return day;
    }

    /* fairs first — they need planning */
    var s1 = el("section");
    s1.appendChild(el("div", "eyebrow", "Nederland, België en Duitsland"));
    s1.appendChild(el("h2", "sec", "Beurzen"));
    var fairs = (d.fairs || []).map(function (f) {
      return { f: f, when: parseDay(f.date) };
    }).filter(function (x) {
      return x.when && days(today, x.when) >= 0;
    }).sort(function (a, b) { return a.when - b.when; });

    if (!fairs.length) {
      s1.appendChild(el("div", "empty", "Op dit moment geen beurzen bekend. De ochtendtaak vult ze aan zodra er data bekend zijn."));
    } else {
      fairs.forEach(function (x) {
        var row = el("div", "ag");
        row.appendChild(dayBlock(x.when));
        var body = el("div", "body");
        var nm = el("div", "nm");
        nm.appendChild(document.createTextNode(x.f.name || ""));
        if (x.f.country) nm.appendChild(el("span", "flag", x.f.country));
        body.appendChild(nm);
        if (x.f.city) body.appendChild(el("div", "where", x.f.city));
        if (x.f.note) body.appendChild(el("div", "nt", x.f.note));
        if (x.f.url) {
          var a = document.createElement("a");
          a.href = x.f.url; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.textContent = "Meer info";
          body.appendChild(a);
        }
        row.appendChild(body);
        row.appendChild(el("div", "cd", "over " + days(today, x.when) + " dgn"));
        s1.appendChild(row);
      });
    }
    stack.appendChild(s1);

    /* what is coming */
    var s2 = el("section");
    s2.appendChild(el("div", "eyebrow", "Om op voor te bereiden"));
    s2.appendChild(el("h2", "sec", "Wat eraan komt"));
    var ag = (d.agenda || []).map(function (a) {
      return { a: a, when: parseDay(a.date) };
    }).filter(function (x) {
      return x.when && days(today, x.when) >= 0;
    }).sort(function (a, b) { return a.when - b.when; });

    if (!ag.length) {
      s2.appendChild(el("div", "empty", "Nog niets in de agenda. De ochtendtaak vult hem aan met releases, jubilea en aankondigingen."));
    } else {
      ag.forEach(function (x) {
        var row = el("div", "ag");
        row.appendChild(dayBlock(x.when));
        var body = el("div", "body");
        body.appendChild(el("div", "nm", x.a.label || ""));
        if (x.a.note) body.appendChild(el("div", "nt", x.a.note));
        row.appendChild(body);
        row.appendChild(el("div", "cd", "over " + days(today, x.when) + " dgn"));
        s2.appendChild(row);
      });
    }
    stack.appendChild(s2);
    host.appendChild(stack);
  }

  /* ================= views ================= */
  var VIEWS = { radar: renderRadar, agenda: renderAgenda };
  var current = "radar";

  function show(name) {
    current = name;
    Object.keys(VIEWS).forEach(function (k) {
      $("view-" + k).hidden = k !== name;
    });
    $("foot").hidden = name !== "radar";
    VIEWS[name]();
    window.scrollTo(0, 0);
  }

  Array.prototype.forEach.call($("switch").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      Array.prototype.forEach.call($("switch").querySelectorAll("button"), function (o) {
        o.setAttribute("aria-selected", o === b ? "true" : "false");
      });
      show(b.getAttribute("data-view"));
    });
  });

  /* ================= loading ================= */
  function apply(d) {
    data = d;
    stamp.textContent = "Bijgewerkt " + (d.updatedLabel || "—");
    VIEWS[current]();
    if (d.quiet && d.quietNote) showFlash(d.quietNote, "warn");
  }

  function loadFeed() {
    return fetch("feed.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (f) {
        if (f && f.items) { feed = f; set("feed", f); }
      })
      .catch(function () { /* de rest van de pagina werkt gewoon door */ });
  }

  function load(manual) {
    if (manual) { refresh.disabled = true; refresh.classList.add("spin"); showFlash("Ophalen…"); }
    return loadFeed()
      .then(function () { return fetch("data.json?t=" + Date.now(), { cache: "no-store" }); })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (d) {
        set("data", d);
        apply(d);
        if (manual) {
          var t = new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
          showFlash("Bijgewerkt om " + t);
          setTimeout(function () { showFlash(null); }, 2500);
        } else if (!(d.quiet && d.quietNote)) {
          showFlash(null);
        }
      })
      .catch(function () {
        var kept = data || get("data", null);
        if (kept) {
          apply(kept);
          showFlash("Geen verbinding — dit is de stand van " + (kept.updatedLabel || "eerder") + ".", "warn");
        } else {
          $("view-radar").innerHTML = "";
          $("view-radar").appendChild(el("p", "skel",
            "Nog niets opgehaald en geen verbinding. Probeer het opnieuw zodra je online bent."));
          showFlash("Geen verbinding.", "bad");
        }
      })
      .then(function () {
        refresh.disabled = false;
        refresh.classList.remove("spin");
      });
  }

  refresh.addEventListener("click", function () { load(true); });

  feed = get("feed", null);
  var cached = get("data", null);
  if (cached) apply(cached);
  load(false);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load(false);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
